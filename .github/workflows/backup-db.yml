name: Respaldo Diario de Base de Datos

on:
  schedule:
    # Se ejecuta todos los días a las 05:00 UTC (00:00 hora Perú / UTC-5)
    - cron: '0 5 * * *'
  workflow_dispatch: # Permite ejecutar el respaldo manualmente desde GitHub Actions

permissions:
  contents: write

jobs:
  backup:
    name: Backup PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependencias del proyecto
        run: npm ci || npm install --no-audit

      - name: Generar cliente Prisma
        run: npx prisma generate

      - name: Instalar cliente de PostgreSQL
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client || true

      - name: Preparar carpeta de respaldos
        run: mkdir -p backups

      - name: Ejecutar Respaldo de Base de Datos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "❌ Error: El secret DATABASE_URL no está configurado en GitHub Secrets."
            echo "👉 Para solucionarlo: Ve a tu repositorio en GitHub -> Settings -> Secrets and variables -> Actions y agrega el secret 'DATABASE_URL' con tu cadena de conexión de Neon."
            exit 1
          fi
          node scripts/backup-db.mjs

      - name: Subir como Artefacto (Descargable por 30 días)
        if: success() && env.BACKUP_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.TIMESTAMP }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30

      - name: Crear Release con Respaldo Permanente en GitHub
        if: success() && env.BACKUP_FILE != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="backup-${{ env.TIMESTAMP }}"
          echo "Publicando release con tag $TAG..."
          gh release create "$TAG" "$BACKUP_FILE" \
            --title "Copia BD - $(date +'%Y-%m-%d')" \
            --notes "Respaldo automático de la base de datos PostgreSQL (Neon). Generado el $(date +'%Y-%m-%d %H:%M:%S UTC')." \
            --prerelease || echo "⚠️ Advertencia: No se pudo crear el release en GitHub. El respaldo permanece disponible en la sección de Artefactos."
